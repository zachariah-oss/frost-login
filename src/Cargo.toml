[package]
name = "frost-login"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "process", "time"] }
clap = { version = "=4.6.5", features = ["derive"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
redb = "=2.6.3"

[[bin]]
name = "frost-login"
path = "main.rs"
